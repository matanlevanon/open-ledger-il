# The Ledger's Tax Authority egress. A small Worker the main Worker calls over a service
# binding, placed near Tel Aviv so the Tax Authority sees an Israeli caller.
# Deploy it before the main Worker: the main Worker's [[services]] binding names it.
name = "open-ledger-il-ita-egress"
main = "src/index.js"
compatibility_date = "2026-08-01"
# Reachable only through the service binding. No public URL of any kind.
workers_dev = false
preview_urls = false

# GCP me-west1 is Tel Aviv. Cloudflare runs this Worker in the data center with the lowest
# latency to that region. The main Worker stays near its users and its database.
[placement]
region = "gcp:me-west1"

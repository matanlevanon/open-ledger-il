# ita-auth: the ITA login broker (README.md). Deploy from this folder: npx wrangler deploy
name = "ita-auth"
main = "src/index.js"
compatibility_date = "2026-09-01"
# Variables set in the dashboard survive a deploy. Secrets always do.
keep_vars = true

[observability]
enabled = true

# The client registry. Make your own with: npx wrangler d1 create ita-auth-clients
# then put its id here and apply migrations/0001_clients.sql once.
[[d1_databases]]
binding = "DB"
database_name = "ita-auth-clients"
database_id = "REPLACE_WITH_YOUR_D1_ID"

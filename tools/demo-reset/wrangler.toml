# R26, R29: open-ledger-sample-reset. Every 15 minutes it sweeps expired visitor sessions and their
# drafts. At 03:00 Israel time it also removes every visitor draft and rebuilds the sample set if it
# changed. Its own Worker, its own bindings to the sample Ledger's D1 and files bucket. Never bind it
# to a real Ledger's database.
name = "open-ledger-sample-reset"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[vars]
ENVIRONMENT = "production"
DEMO_MODE = "1"

# Secrets:
#   RESET_SECRET        Shared with the sample Ledger's DEMO_RESET_SECRET, for POST /run.
#   SLACK_WEBHOOK_URL   Alerts when a sweep or a reset fails or rolls back.

[[d1_databases]]
binding = "DB"
database_name = "open-ledger-sample"
database_id = "REPLACE_WITH_YOUR_SAMPLE_D1_ID"

[[r2_buckets]]
binding = "FILES"
bucket_name = "open-ledger-sample-files"

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "open-ledger-sample-backups"

# One trigger, every 15 minutes: the sweep on every run, and the nightly reset on the first run in
# the 03:00 hour in Israel (00:00 UTC in summer, 01:00 UTC in winter). One trigger keeps the account
# inside the Workers Free cron budget.
[triggers]
crons = ["*/15 * * * *"]

# The sample set renders its contracts with the Ledger's own code, which bundles its fonts.
[[rules]]
type = "Data"
globs = ["**/*.woff2"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true

[[rules]]
type = "Text"
globs = ["**/*.svg"]
fallthrough = true
